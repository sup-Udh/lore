[package]
name = "llm-model-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
candle-core = "0.10.2"
candle-transformers = "0.10.2"
tokenizers = "0.22.2"
clap = { version = "4.0", features = ["derive"] }
colored = "2.1"
axum = "0.8"
tokio = { version = "1.44", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
num_cpus = "1.17.0"
# QWEN LLAMA.CPP MIGRATION — Qwen runs through llama-cpp bindings,
# Phi-3 and Mistral continue to use Candle.
llama-cpp-2 = "0.1.146"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
