[package]
name = "llm-model-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
candle-core = "0.10.2"
candle-transformers = "0.10.2"
tokenizers = "0.22.2"
clap = { version = "4.0", features = ["derive"] }
colored = "2.1"
axum = "0.8"
tokio = { version = "1.44", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"